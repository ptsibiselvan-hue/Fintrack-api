spring.application.name=fintrack-api
# Dev/test database. Override with environment variables for production (never hardcode credentials).
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:fintrack;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
logging.level.com.fintrack=INFO
